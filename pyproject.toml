[project]
name = "playbot-agent"
version = "0.1.0"
description = "Playbot: general-purpose LLM purple agent (A2A) for AgentBeats evaluations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "openai>=3.8.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
# Lets keyless unit tests import src/llm.py directly (tests/test_llm.py).
pythonpath = ["src"]
